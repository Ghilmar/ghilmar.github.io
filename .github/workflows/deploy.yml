name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install, build and upload site
        uses: withastro/action@v3
        # SITE_URL y BASE_PATH se resuelven con sus valores por defecto en
        # astro.config.mjs (ghilmar.github.io con base /).
        # Si algún día usas un repo de proyecto, define aquí:
        #   env:
        #     SITE_URL: https://ghilmar.github.io
        #     BASE_PATH: /nombre-del-repositorio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4